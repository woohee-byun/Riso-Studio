:root{
  --paper:#ffffff; --paper2:#f3f3f3; --ink:#1c1c1c; --red:#0078BF; --cream:#ffffff; --line:#241f20; --mute:#777;
  --display:'Aeonik Fono',system-ui,sans-serif; --ui:'Aeonik Fono',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-weight:300;font-size:14px;line-height:1.4;}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:2px solid var(--line)}
.logo{padding:12px 34px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:17px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.hbtns{display:flex;gap:8px}
.btn{font-weight:500;border:2px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;min-height:40px}
.btn:hover{background:var(--paper2)}
.btn.primary{background:var(--red);color:#fbf6ea;border-color:var(--line)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
main{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:0;min-height:0}
aside{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:20px}
aside.left{border-right:2px solid var(--line)} aside.right{border-left:2px solid var(--line)}
h2{font-family:var(--ui);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 6px;font-weight:700;min-height:40px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);padding:0;position:relative;min-width:34px}
.sw[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:3px}
.sw:hover{transform:scale(1.08)}
.swname{margin-top:8px;font-size:13px;color:var(--mute);min-height:18px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;background:transparent;padding:6px 8px;text-align:left;font-size:12px;font-weight:500}
.preset:hover{background:var(--paper2)}
.dots{display:flex}.dots i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);margin-left:-5px;mix-blend-mode:multiply;background-blend-mode:multiply}.dots i:first-child{margin-left:0}
.layers{display:flex;flex-direction:column;position:relative}
.layers.linked::before{content:"";position:absolute;left:11px;top:22px;bottom:22px;width:2px;background:var(--ink);opacity:.55}
.layer{display:grid;grid-template-columns:24px 22px 1fr auto;gap:6px;align-items:center;border:2px solid transparent;border-radius:12px;padding:6px 6px 6px 0;margin:2px 0;background:transparent;position:relative}
.layer[aria-current=true]{border-color:var(--line);background:var(--paper2)}
.layer .lk{width:24px;height:24px;display:grid;place-items:center;background:var(--paper);border-radius:50%;z-index:1}
.layer .chip{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.layer .nm{font-weight:700;border:0;background:none;text-align:left;padding:4px 0;min-height:32px}
.layer .nm small{display:block;font-weight:400;color:var(--mute)}
.lbtns{display:flex;gap:2px}
.ib{border:0;background:transparent;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;padding:0}
.ib:hover{background:var(--paper)}
.ib[aria-pressed=false].eye{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.slider{display:grid;gap:4px;margin-bottom:12px}
.slider label{display:flex;justify-content:space-between;font-weight:500}
.slider output{color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--red);height:28px;margin:0}
.badge{font-size:11px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:0 7px;margin-left:6px}
.paper{display:flex;gap:10px}
.paper button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);padding:0}
.paper button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:3px}
/* stage */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:2px solid var(--line)}
.toolbar .sp{flex:1}
.link{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;background:transparent;min-height:40px}
.link[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.zoom{display:flex;align-items:center;gap:8px;min-width:150px}
.zoom input{flex:1}
select{font:inherit;border:2px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);padding:7px 10px;min-height:40px}
.canvaswrap{flex:1;display:grid;place-items:center;padding:20px;min-height:360px;position:relative}
.frame{position:relative;max-width:100%;max-height:100%;box-shadow:6px 6px 0 var(--ink);border:2px solid var(--line);background:var(--paper2);touch-action:none;cursor:grab;
  width:min(100%, calc((100vh - 190px) * var(--ar)));aspect-ratio:var(--ar)}
.frame.drag{cursor:grabbing}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#over{pointer-events:none}
.label{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .15s}
.label.on{opacity:1}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--cream);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:12px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.progress{position:absolute;right:10px;top:10px;background:var(--cream);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;display:none;align-items:center;gap:6px}
.progress.on{display:flex}
.spin{width:12px;height:12px;border:2px solid var(--ink);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.empty.on{display:flex}
.empty h1{font-family:var(--ui);font-weight:300;font-size:clamp(28px,5vw,44px);margin:0;color:var(--ink)}
.empty p{margin:0;color:var(--mute)}
.drop{position:absolute;inset:8px;border:3px dashed var(--ink);border-radius:18px;display:none;pointer-events:none;background:rgba(0,120,191,.12)}
.drop.on{display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:12px;z-index:9;box-shadow:4px 4px 0 var(--red)}
.toast.on{display:flex}
.toast button{border:2px solid var(--paper);background:transparent;border-radius:999px;color:var(--paper);padding:3px 12px;font-weight:700}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);min-height:20px;margin:-4px 0 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:980px){
  main{grid-template-columns:1fr;grid-template-rows:auto}
  .stage{order:-1}
  aside.left,aside.right{border:0;border-top:2px solid var(--line)}
  .frame{width:min(100%, calc(60vh * var(--ar)))}
  .canvaswrap{min-height:0;padding:14px 16px}
  .swatches{grid-template-columns:repeat(6,1fr)}
}

/* ---- Midjourney-style skin ---- */
:root{--ink:#2f323d;--mute:#8b8e98;--line:#e6e6e8;--paper2:#f6f6f7;--card:#fafafa;--pill:#ededef;--selbg:#d6ebf9;--selfg:#005f9e}
main,.stage{background:#fff}
header{border-bottom:1px solid var(--line);padding:14px 24px}
aside{padding:14px;gap:12px}
aside.left{border-right:1px solid var(--line)} aside.right{border-left:1px solid var(--line)}
aside section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
h2{font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;margin:0 0 12px;color:var(--ink)}
#forLayer{font-size:12px!important;color:var(--mute)!important}
.toolbar{border-bottom:1px solid var(--line);padding:10px 16px}
.btn,.link,select{border:1px solid var(--line);background:var(--pill);border-radius:999px;min-height:34px;padding:5px 14px;font-weight:400;color:var(--ink)}
.btn:hover,.link:hover{background:#e4e4e7}
.btn.primary,.link[aria-pressed=true]{background:var(--selbg);color:var(--selfg);border-color:transparent;font-weight:500}
.btn.primary:hover{filter:none;background:#c4e1f5}
.btn[disabled]{opacity:.5}
.seg{border:0;background:var(--pill);padding:0}
.seg button{min-height:32px;font-weight:400;color:var(--ink);padding:5px 14px}
.seg button[aria-pressed=true]{background:var(--selbg);color:var(--selfg);font-weight:500;border-radius:999px}
.sw{border:1px solid rgba(0,0,0,.12)}
.sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.swname{font-size:12px}
.preset{border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:400}
.dots i{border:1px solid rgba(0,0,0,.15)}
.layers.linked::before{background:var(--mute);opacity:.5}
.layer{border:1px solid transparent}
.layer[aria-current=true]{background:#fff;border-color:var(--line)}
.layer .lk{background:transparent}
.layer .chip{border:1px solid rgba(0,0,0,.15)}
.layer .nm{font-weight:400}.layer .nm small{font-size:12px}
.ib:hover{background:var(--pill)}
.slider{grid-template-columns:96px 1fr;align-items:center;gap:10px;margin:0;padding:10px 0;border-top:1px solid var(--line)}
section>div>.slider:first-child,section>.slider:first-of-type{border-top:0}
.slider label{flex-direction:column;justify-content:flex-start;gap:0}
.slider output{font-size:11px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:var(--pill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#434756;margin-top:-4.5px;border:0}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:var(--pill)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#434756;border:0}
input[type=range]:disabled{opacity:.45}
.badge{border:0;background:var(--selbg);color:var(--selfg)}
.frame{border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.06);overflow:hidden}
.hint,.progress{border:1px solid var(--line);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.toast{border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.18);background:var(--ink)}
.toast button{border:1px solid rgba(255,255,255,.6)}
.empty h1{font-weight:300;color:var(--ink)}
.status{margin:0 0 8px}
@media (max-width:980px){aside.left,aside.right{border:0}}
.lctl{grid-column:1/-1;margin:4px 6px 4px 30px;padding-top:6px;border-top:1px solid var(--line)}.lctl .slider{grid-template-columns:84px 1fr;padding:6px 0;border-top:0}.lctl .row{margin-top:6px}.layer .nm{overflow-wrap:anywhere}select{-webkit-appearance:none;appearance:none;padding:5px 38px 5px 16px;min-width:120px;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none' stroke='%232f323d' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M1 1.5l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 16px center}

@media (min-width:981px){
  html,body{height:100%;overflow:hidden}
  .app{height:100vh;min-height:0}

  .swname{margin-top:4px;min-height:16px}
  .status{margin:0 0 4px}
}

  .preset{font-size:11.5px;white-space:nowrap;padding:3px 8px;gap:6px}.dots i{width:13px;height:13px}

}

<body>
<div class="app">
<header>
  <div class="logo" role="img" aria-label="Riso Studio"><span class="lg a" aria-hidden="true">Riso Studio</span><span class="lg b" aria-hidden="true">Riso Studio</span></div>
  <div class="hbtns">
    <button class="btn" id="btnNew">Add photo</button>
    <div class="dl"><button class="btn primary" id="btnExport" disabled aria-haspopup="menu" aria-expanded="false">Download PNG <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px;margin-left:4px"><path d="M3 5l4 4 4-4"/></svg></button>
      <div class="menu" id="dlMenu" role="menu" hidden><button role="menuitem" data-b="paper">White background</button><button role="menuitem" data-b="clear">Transparent</button></div></div>
  </div>
</header>
<main>
  <aside class="left" aria-label="Inks and layers">
    <section>
      <h2>Inks</h2>
      <div class="seg" id="modeSeg" role="group" aria-label="Ink mode">
        <button data-m="1">Single</button><button data-m="2">Duo</button><button data-m="3">Tri</button>

    </section>
    <section>

      <div class="layers" id="layers" role="list"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="btnRand">Randomize</button>
      </div>
    </section>
    <section>
      <h2>Combos</h2>

    </section>
  </aside>

  <section class="stage" aria-label="Canvas">
    <div class="toolbar">
      <button class="link" id="btnLink" aria-pressed="true" aria-label="Link layers"></button>
      <select id="aspect" aria-label="Canvas ratio">
        <option value="1" selected>1:1</option><option value="0.8">4:5</option><option value="0.75">3:4</option><option value="1.7778">16:9</option>
      </select>
      <div class="sp"></div>
      <div class="zoom" role="group" aria-label="Zoom"><button class="btn zb" id="zOut" aria-label="Zoom out">&minus;</button><output id="zv" aria-live="polite">100%</output><button class="btn zb" id="zIn" aria-label="Zoom in">+</button></div>
    </div>
    <div class="canvaswrap" id="wrap">
      <div class="frame" id="frame" style="--ar:1" tabindex="0" aria-label="Canvas. Arrow keys move the photo, plus and minus zoom.">
        <canvas id="cv"></canvas><canvas id="over" width="900" height="675"></canvas>
        <div class="label" id="dragLabel"></div>
        <div class="hint" id="hint" style="opacity:0">Drag to reposition · Use + and − to zoom</div>
        <div class="progress" id="prog"><span class="spin"></span><span id="progTxt">Preparing…</span></div>
        <div class="empty on" id="empty">
          <h1>Drop a photo</h1>
          <p>It stays on your device. Nothing is uploaded.</p>
          <div class="row" style="justify-content:center">
            <button class="btn primary" id="btnPick">Choose photo</button>
            <button class="btn" id="btnSample">Try a sample</button>
          </div>
        </div>
        <div class="drop" id="dropHi"></div>
      </div>
    </div>
  </section>

  <aside class="right" aria-label="Texture and export">
    <section>
      <h2 class="h2i between">Texture <button class="info" type="button" id="btnReset" data-name="Reset texture" aria-label="Reset texture"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 7a4.8 4.8 0 1 0 1.5-3.5"/><path d="M2.4 1.6v2.6h2.6"/></svg></button></h2>
      <div id="sliders"></div>
    </section>
    <section>
      <h2 class="h2i between"><span class="h2l">Subject focus <button class="info" type="button" data-name="Fades the background to white so your subject stands out. Basic mode removes bright areas first." aria-label="About Subject focus: Fades the background to white so your subject stands out. Basic mode removes bright areas first."><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5.8"/><path d="M7 6.3v3.6"/><circle cx="7" cy="4.2" r=".4" fill="currentColor"/></svg></button></span><button class="switch" type="button" role="switch" id="focusT" aria-checked="false" aria-label="Subject focus"><i></i></button></h2>
      <div class="slider"><label for="bg">Background <output id="bgv">0</output></label><input type="range" id="bg" min="0" max="100" value="0" disabled></div>
    </section>
  </aside>
</main>
</div>
<div class="colorpop" id="colorPop" hidden role="dialog" aria-label="Ink color"><div class="swatches" id="swatches" role="group" aria-label="Ink colors"></div></div>
<div class="photopop" id="photoPop" hidden role="dialog" aria-label="Choose photo"><div class="pgrid" id="pgrid"></div><button class="btn" id="pUpload">Upload photos</button></div>
<div class="toast" id="toast" role="status"><span id="toastTxt"></span><button id="toastUndo">Undo</button></div>
<div class="sr" id="live" aria-live="polite"></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
'use strict';
const $=s=>document.querySelector(s);
const INKS=[

const newTf=()=>({x:0,y:0,s:1,rot:0});
function mkLayers(){S.layers=[['Fluorescent Pink'],['Blue'],['Yellow']].map(([c])=>({ink:c,on:true,img:S.img,tf:newTf()}))}
mkLayers();
const active=()=>S.layers.slice(0,S.mode);

/* ---------- UI build ---------- */

  ?'<path d="M7 4.5H5.2a3.5 3.5 0 0 0 0 7H7M9 4.5h1.8a3.5 3.5 0 0 1 0 7H9M5.8 8h4.4"/>'
  :'<path d="M5.2 4.5H3.4a3.5 3.5 0 0 0 0 7h1.8M10.8 4.5h1.8a3.5 3.5 0 0 1 0 7h-1.8M8 5v6"/>'}</g></svg>`;

const arrow=d=>`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12V2.5M3.5 6L7 2.5 10.5 6"/></svg>`;

function buildStatic(){
  $('#swatches').innerHTML=INKS.map(([n,h],i)=>`<button class="sw" data-i="${i}" style="background:${h}" aria-label="${n}" aria-pressed="false" data-name="${n}"></button>`).join('');
  $('#presets').innerHTML=PRESETS.map((p,i)=>`<button class="preset" data-i="${i}"><span class="dots">${p[2].map(c=>`<i style="background:${inkHex(c)}"></i>`).join('')}</span>${p[0]}</button>`).join('');
  $('#sliders').innerHTML=SL.map(([k,l])=>`<div class="slider"><label for="s_${k}">${l} <output id="o_${k}"></output></label><input type="range" id="s_${k}" data-k="${k}" min="0" max="100"></div>`).join('');
}
function syncUI(){
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===S.mode));
  const L=S.layers[S.sel];
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',INKS[b.dataset.i][0]===L.ink))
  // layers
  const lay=$('#layers'); lay.classList.toggle('linked',S.linked&&S.mode>1);
  lay.innerHTML=active().map((l,i)=>`<div class="layer" role="listitem" data-i="${i}" aria-current="${i===S.sel}">
    <span class="lk" title="${S.linked?'Linked':'Unlinked'}" role="img" aria-label="${S.linked?'Linked':'Unlinked'}">${chain(S.linked)}</span>
    <button class="chip" data-act="color" style="background:${inkHex(l.ink)}" aria-haspopup="dialog" aria-label="Change ${l.ink} ink color" title=""></button>
    <button class="nm" data-act="sel">${l.ink}</button>
    <span class="lbtns">
      <button class="ib eye" data-act="eye" aria-pressed="${l.on}" aria-label="${l.on?'Hide':'Show'} ${l.ink} layer">${eye(l.on)}</button>
      <button class="ib" data-act="rep" aria-haspopup="dialog" aria-label="Choose photo for ${l.ink} layer" title=""><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 11l4-4 3 3 2-2 3 3"/></svg></button>
    </span>${S.open.has(i)?`<div class="lctl">
      <div class="slider"><label>Position X <output data-posv="x" data-i="${i}">${Math.round((S.linked?S.layers[0].tf:l.tf).x*100)}</output></label><input type="range" data-pos="x" data-i="${i}" aria-label="Position X, ${l.ink}" min="-100" max="100" value="${Math.round((S.linked?S.layers[0].tf:l.tf).x*100)}"></div>
      <div class="slider"><label>Position Y <output data-posv="y" data-i="${i}">${Math.round((S.linked?S.layers[0].tf:l.tf).y*100)}</output></label><input type="range" data-pos="y" data-i="${i}" aria-label="Position Y, ${l.ink}" min="-100" max="100" value="${Math.round((S.linked?S.layers[0].tf:l.tf).y*100)}"></div>
      <div class="row"><button class="btn" data-act="rot">Rotate 90°</button><button class="btn" data-act="pos">Reset position</button></div>
    </div>`:''}</div>`).join('');
  const ea=$('#btnExpAll');if(ea){const all=active().every((_,i)=>S.open.has(i));ea.dataset.name=all?'Collapse all':'Expand all';ea.innerHTML=`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 2.5h9"/>${all?'<path d="M3.5 10l3.5-3.5L10.5 10"/>':'<path d="M3.5 6l3.5 3.5L10.5 6"/>'}</svg>`;ea.setAttribute('aria-label',ea.dataset.name)}
  const lk=$('#btnLink'); lk.setAttribute('aria-pressed',S.linked);
  lk.innerHTML=chain(S.linked)+`<span>${S.linked?'Linked':'Unlinked'}</span>`;
  SL.forEach(([k])=>{$('#s_'+k).value=S.vals[k];$('#o_'+k).textContent=S.vals[k]});
  $('#focusT').setAttribute('aria-checked',S.focus);
  $('#bg').disabled=!S.focus; $('#bg').value=S.bg; $('#bgv').textContent=S.bg;
  $('#zv').textContent=Math.round(refTf().s*100)+'%';
}
const refTf=()=>(S.linked?S.layers[0]:S.layers[S.sel]).tf;

/* ---------- rendering ---------- */
const off=document.createElement('canvas'),octx=off.getContext('2d',{willReadFrequently:true});
const ss=(a,b,x)=>{x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x)};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
function hash(x,y,s){let n=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s+1,982451653);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
const ANG=[Math.PI/4,Math.PI/12,Math.PI*5/12];
const dims=(long)=>{const a=S.ar;return a>=1?[long,Math.round(long/a)]:[Math.round(long*a),long]};
function fitK(img,W,H){const a=W/img.width,b=H/img.height;return S.fill?Math.max(a,b):Math.min(a,b)}

function render(long,transparent){
  const [W,H]=dims(long); off.width=W;off.height=H;
  const act=active(), n=S.mode, k=W/900;
  const paper=hex(S.paperHex);
  const out=new ImageData(W,H); const od=out.data;
  const rgbW=new Float32Array(W*H*3).fill(1), prod=new Float32Array(W*H).fill(1);
  const v=S.vals, cell=(3+v.halftone/100*13)*k, grain=v.grain/100, con=0.5+v.contrast*0.02, shift=v.shift/100*0.012*W;
  const offs=[[0,0],[1,-.7],[-1,.8]], bg=S.focus?S.bg/100:0;
  act.forEach((L,i)=>{
    if(!L.on||!L.img)return;
    octx.setTransform(1,0,0,1,0,0); octx.clearRect(0,0,W,H);
    const t=L.tf,K=fitK(L.img,W,H)*t.s;
    octx.translate(W/2+t.x*W+offs[i][0]*shift,H/2+t.y*W+offs[i][1]*shift); octx.rotate(t.rot); octx.scale(K,K);
    octx.drawImage(L.img,-L.img.width/2,-L.img.height/2);
    const d=octx.getImageData(0,0,W,H).data, col=hex(inkHex(L.ink)), ang=ANG[i], ca=Math.cos(ang), sa=Math.sin(ang);
    for(let y=0,p=0;y<H;y++)for(let x=0;x<W;x++,p++){
      const q=p*4, ia=d[q+3]; if(!ia)continue;
      let l=(0.299*d[q]+0.587*d[q+1]+0.114*d[q+2])/255/(ia/255);
      l=l>1?1:l;
      let D=1-((l-0.5)*con+0.5); D=D<0?0:D>1?1:D;
      let dens;
      if(n===1)dens=D;
      else if(n===2)dens=i===0?ss(.4,.9,D):ss(.08,.75,D)*.95;
      else dens=i===0?ss(.6,.95,D):i===1?ss(.3,.75,D)*.9:ss(.05,.5,D);
      if(bg)dens*=1-bg*ss(.5,.92,l);
      dens*=ia/255;
      dens+=(hash(x,y,i)-.5)*grain*.35*(dens>0.02?1:0);
      if(dens<=0)continue; if(dens>1)dens=1;
      const u=(x*ca+y*sa)/cell, w=(-x*sa+y*ca)/cell;
      const fu=u-Math.floor(u)-.5, fv=w-Math.floor(w)-.5;
      const dist=Math.sqrt(fu*fu+fv*fv)*cell, r=Math.sqrt(dens)*.7072*cell;
      let cov=(r-dist)/(0.9*k+0.4)+.5; cov=cov<0?0:cov>1?1:cov;
      if(cov<=0)continue;
      if(grain)cov*=1-grain*.4*hash(x,y,i+7)*hash(y,x,i+3);
      const a=cov*.93, m=p*3;
      rgbW[m]*=1-a*(1-col[0]); rgbW[m+1]*=1-a*(1-col[1]); rgbW[m+2]*=1-a*(1-col[2]); prod[p]*=1-a;
    }
  });
  for(let p=0;p<W*H;p++){
    const q=p*4,m=p*3;
    if(transparent){
      const A=1-prod[p];
      if(A<.004){od[q+3]=0;continue}
      for(let c=0;c<3;c++){const u=(rgbW[m+c]-prod[p])/A;od[q+c]=255*(u<0?0:u>1?1:u)}
      od[q+3]=A*255;
    }else{
      const g=1+(hash(p%W,(p/W)|0,99)-.5)*grain*.09, g2=1+(hash((p%W)>>1,((p/W)|0)>>1,98)-.5)*grain*.06;
      for(let c=0;c<3;c++){const u=paper[c]*rgbW[m+c]*g*g2;od[q+c]=255*(u>1?1:u)}
      od[q+3]=255;
    }
  }
  return out;
}
const cv=$('#cv'),cctx=cv.getContext('2d');
let rq=0,lowRes=false,hiTimer=0;
function draw(low){lowRes=!!low;if(rq)return;rq=requestAnimationFrame(()=>{rq=0;if(!S.img)return;
  const im=render(lowRes?450:900,false); cv.width=im.width;cv.height=im.height;cctx.putImageData(im,0,0); outline();});}
function outline(){
  const o=$('#over'),c=o.getContext('2d');const [W,H]=dims(900);o.width=W;o.height=H;c.clearRect(0,0,W,H);
  if(!S.img)return; const lw=2*W/$('#frame').clientWidth; c.lineWidth=lw;c.strokeStyle='#FF48B0';c.setLineDash([8*lw/2,5*lw/2]);
  const list=S.linked?active():[S.layers[S.sel]];
  if(!dragging&&!showOutline)return;
  list.forEach(L=>{const t=L.tf,K=fitK(L.img,W,H)*t.s;c.save();c.translate(W/2+t.x*W,H/2+t.y*W);c.rotate(t.rot);c.strokeRect(-L.img.width*K/2,-L.img.height*K/2,L.img.width*K,L.img.height*K);c.restore()});
}
let showOutline=false,dragging=false;

/* ---------- image loading ---------- */
function loadImg(f){return new Promise(res=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>res(null);im.src=u})}
function thumb(im){const c=document.createElement('canvas');c.width=c.height=112;const x=c.getContext('2d'),k=Math.max(112/im.width,112/im.height);x.drawImage(im,(112-im.width*k)/2,(112-im.height*k)/2,im.width*k,im.height*k);return c.toDataURL('image/jpeg',.8)}
function pushPhoto(im){const p={img:im,thumb:thumb(im)};S.photos.push(p);return p}
async function addFiles(files,target){
  files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  const first=!S.photos.length,added=[];
  for(const f of files){const im=await loadImg(f);if(im)added.push(pushPhoto(im))}
  if(!added.length){toast('Couldn\'t open those files.');return}
  if(first)startWith(added);
  else if(target!=null){assignPhoto(target,added[0].img);if(added.length>1)toast(added.length-1+' more photo'+(added.length>2?'s':'')+' added to your photos.')}
  else{toast(added.length+' photo'+(added.length>1?'s':'')+' added. Pick one from a layer\'s photo button.');openPhoto(S.sel)}
}
function startWith(added){
  S.img=added[0].img;const n=added.length;
  S.layers.forEach((l,i)=>{l.img=added[n>1?i%n:0].img;l.tf=newTf()});
  S.linked=n===1;S.sel=0;
  $('#empty').classList.remove('on'); $('#btnExport').disabled=false;
  const h=$('#hint'); h.style.opacity=1; setTimeout(()=>h.style.opacity=0,3500);
  if(n>1)toast(n+' photos added. Layers unlinked so each photo moves on its own.');
  syncUI(); draw();
}
function assignPhoto(i,img){
  const L=S.layers[i];L.img=img;L.tf=newTf();S.sel=i;
  if(S.linked&&S.layers.some(x=>x.img!==img)){S.linked=false;toast('Layers unlinked. Each photo now moves on its own.',()=>setLinked(true,'Layers linked'))}
  syncUI();draw();
}

let lastSet=-1;
async function sample(){
  let k;do{k=Math.floor(Math.random()*SAMPLE_SETS.length)}while(SAMPLE_SETS.length>1&&k===lastSet);lastSet=k;
  const ims=await Promise.all(SAMPLE_SETS[k].map(u=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=u})));
  const ok=ims.filter(Boolean);if(!ok.length)return;
  S.photos=[];startWith(ok.map(pushPhoto));
}

/* ---------- transforms / interaction ---------- */
function targets(){return S.linked?S.layers:[S.layers[S.sel]]}
function mod(fn){targets().forEach(L=>fn(L.tf))}
const frame=$('#frame'),ptrs=new Map();let last=null,lastDist=0;
const lbl=$('#dragLabel');
function showLabel(){lbl.textContent=S.linked&&S.mode>1?'Moving all layers':S.linked?'Moving photo':`Moving ${S.layers[S.sel].ink} layer`;lbl.classList.add('on')}
frame.addEventListener('pointerdown',e=>{if(!S.img)return;frame.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);dragging=true;frame.classList.add('drag');showLabel();
  last=[e.clientX,e.clientY];lastDist=0;frame.focus({preventScroll:true})});
frame.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  const w=frame.clientWidth;
  if(ptrs.size>=2){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(lastDist)mod(t=>t.s=Math.min(5,Math.max(.2,t.s*d/lastDist)));lastDist=d;}
  else{const dx=(e.clientX-last[0])/w,dy=(e.clientY-last[1])/w;last=[e.clientX,e.clientY];mod(t=>{t.x+=dx;t.y+=dy});}
  syncSliders();draw(true);outline()});
const endDrag=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size===1)last=[...ptrs.values()][0];lastDist=0;
  if(!ptrs.size){dragging=false;frame.classList.remove('drag');lbl.classList.remove('on');draw(false);outline();syncUI()}};
frame.addEventListener('pointerup',endDrag);frame.addEventListener('pointercancel',endDrag);
frame.addEventListener('keydown',e=>{if(!S.img)return;const st=.01,m={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(m){e.preventDefault();mod(t=>{t.x+=m[0];t.y+=m[1]})}
  else if(e.key==='+'||e.key==='='){mod(t=>t.s=Math.min(5,t.s*1.05))}
  else if(e.key==='-'){mod(t=>t.s=Math.max(.2,t.s/1.05))}else return;
  e.preventDefault();syncSliders();draw();});
function syncSliders(){const t=refTf();$('#zv').textContent=Math.round(t.s*100)+'%';document.querySelectorAll('[data-pos]').forEach(el=>{const L=S.layers[+el.dataset.i],q=(S.linked?S.layers[0].tf:L.tf)[el.dataset.pos];el.value=Math.round(q*100);document.querySelector(`[data-posv="${el.dataset.pos}"][data-i="${el.dataset.i}"]`).textContent=el.value})}

const zoomBy=f=>{if(!S.img)return;mod(t=>t.s=Math.min(5,Math.max(.2,t.s*f)));syncSliders();draw(true);clearTimeout(hiTimer);hiTimer=setTimeout(()=>draw(false),150)};
$('#zIn').onclick=()=>zoomBy(1.1);$('#zOut').onclick=()=>zoomBy(1/1.1);
$('#aspect').onchange=e=>{const v=+e.target.value;S.aspect=v;S.ar=v;frame.style.setProperty('--ar',S.ar);draw()};

/* ---------- link + toast ---------- */
function setLinked(v,msg){S.linked=v;syncUI();draw();$('#live').textContent=msg||(v?'Layers linked':'Layers unlinked')}
$('#btnLink').onclick=()=>{
  setLinked(!S.linked)};
let tt=0,undoFn=null;
function toast(msg,undo){$('#toastTxt').textContent=msg;const t=$('#toast');t.classList.add('on');$('#toastUndo').style.display=undo?'':'none';undoFn=undo;
  $('#live').textContent=msg;clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4000)}
$('#toastUndo').onclick=()=>{if(undoFn)undoFn();$('#toast').classList.remove('on')};

/* ---------- layers / inks ---------- */
let repIdx=0;
$('#btnExpAll').onclick=()=>{const all=active().every((_,i)=>S.open.has(i));S.open=all?new Set():new Set(active().map((_,i)=>i));syncUI()};
$('#layers').oninput=e=>{const ax=e.target.dataset.pos;if(!ax)return;const i=+e.target.dataset.i,v=e.target.value/100;
  if(S.linked){const d=v-S.layers[0].tf[ax];S.layers.forEach(L=>L.tf[ax]+=d)}else S.layers[i].tf[ax]=v;syncSliders();draw(true);clearTimeout(hiTimer);hiTimer=setTimeout(()=>draw(false),150)};
$('#layers').onclick=e=>{const row=e.target.closest('.layer');if(!row)return;const i=+row.dataset.i;let b=e.target.closest('[data-act]');
  if(!b){if(e.target.closest('.lctl'))return;b=row.querySelector('[data-act=sel]')}const a=b.dataset.act;
  if(a==='color'){e.stopPropagation();openColor(i);return}
  const tg=()=>S.linked?S.layers:[S.layers[i]];
  if(a==='rot'){tg().forEach(L=>L.tf.rot+=Math.PI/2);draw();return}
  if(a==='pos'){tg().forEach(L=>Object.assign(L.tf,newTf()));syncUI();draw();return}
  if(a==='tog'){S.sel=i;S.open.has(i)?S.open.delete(i):S.open.add(i);syncUI();return}
  if(a==='sel'){if(S.sel===i&&S.open.has(i))S.open.delete(i);else S.open.add(i);S.sel=i;showOutline=true;syncUI();draw();clearTimeout(hiTimer);hiTimer=setTimeout(()=>{showOutline=false;outline()},1500)}
  if(a==='eye'){S.layers[i].on=!S.layers[i].on;syncUI();draw()}
  if(a==='rep'){e.stopPropagation();S.sel=i;syncUI();openPhoto(i);return}};
$('#swatches').onclick=e=>{const b=e.target.closest('.sw');if(!b)return;S.layers[S.sel].ink=INKS[b.dataset.i][0];closeColor();syncUI();draw()};
const pop=$('#colorPop');
function openColor(i){closePhoto();S.sel=i;syncUI();
  const chip=document.querySelector(`.layer[data-i="${i}"] .chip`);if(!chip)return;pop.hidden=false;
  const r=chip.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  pop.style.left=Math.min(innerWidth-w-8,r.right+10)+'px';pop.style.top=Math.max(8,Math.min(innerHeight-h-8,r.top-8))+'px'}
function closeColor(){pop.hidden=true}
pop.addEventListener('click',e=>e.stopPropagation());
const pp=$('#photoPop');
function openPhoto(i){closeColor();const L=S.layers[i];
  $('#pgrid').innerHTML=S.photos.map((p,k)=>`<button class="pth" data-k="${k}" aria-pressed="${p.img===L.img}" aria-label="Photo ${k+1}"><img src="${p.thumb}" alt=""></button>`).join('');
  pp.dataset.i=i;pp.hidden=false;
  const el=document.querySelector(`.layer[data-i="${i}"] [data-act=rep]`);if(!el)return;
  const r=el.getBoundingClientRect(),w=pp.offsetWidth,h=pp.offsetHeight;
  pp.style.left=Math.min(innerWidth-w-8,r.right+10)+'px';pp.style.top=Math.max(8,Math.min(innerHeight-h-8,r.top-8))+'px'}
function closePhoto(){pp.hidden=true}
pp.addEventListener('click',e=>e.stopPropagation());
$('#pgrid').onclick=e=>{const b=e.target.closest('.pth');if(!b)return;const i=+pp.dataset.i;closePhoto();assignPhoto(i,S.photos[+b.dataset.k].img)};
$('#pUpload').onclick=()=>{fileTarget=+pp.dataset.i;closePhoto();$('#file').click()};
document.addEventListener('click',closePhoto);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhoto()});
document.addEventListener('click',closeColor);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeColor()});
const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
function showTip(b){tip.textContent=b.dataset.name;tip.classList.add('on');const r=b.getBoundingClientRect(),w=tip.offsetWidth;
  tip.style.left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2))+'px';tip.style.top=(r.top-tip.offsetHeight-8)+'px'}
const hideTip=()=>tip.classList.remove('on');
$('#swatches').addEventListener('mouseover',e=>{const b=e.target.closest('.sw');if(b)showTip(b)});
$('#swatches').addEventListener('mouseout',hideTip);
$('#swatches').addEventListener('focusin',e=>{const b=e.target.closest('.sw');if(b)showTip(b)});
$('#swatches').addEventListener('focusout',hideTip);

document.addEventListener('mouseover',e=>{const b=e.target.closest('.info');if(b)showTip(b)});
document.addEventListener('mouseout',e=>{if(e.target.closest('.info'))hideTip()});
document.addEventListener('focusin',e=>{const b=e.target.closest('.info');if(b)showTip(b)});
document.addEventListener('focusout',e=>{if(e.target.closest('.info'))hideTip()});
$('#modeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.mode=+b.dataset.m;if(S.sel>=S.mode)S.sel=0;syncUI();draw()};
$('#presets').onclick=e=>{const b=e.target.closest('.preset');if(!b)return;const [,m,c]=PRESETS[b.dataset.i];S.mode=m;c.forEach((n,i)=>{S.layers[i].ink=n;S.layers[i].on=true});S.sel=0;syncUI();draw()};
$('#btnRand').onclick=()=>{S.mode=1+Math.floor(Math.random()*3);const pool=INKS.map(i=>i[0]).sort(()=>Math.random()-.5);
  S.layers.forEach((l,i)=>{l.ink=pool[i];l.on=true});SL.forEach(([k])=>S.vals[k]=Math.round(15+Math.random()*70));S.sel=0;syncUI();draw()};
$('#sliders').oninput=e=>{const k=e.target.dataset.k;if(!k)return;S.vals[k]=+e.target.value;$('#o_'+k).textContent=e.target.value;draw(true);clearTimeout(hiTimer);hiTimer=setTimeout(()=>draw(false),120)};
$('#btnReset').onclick=()=>{S.vals={...DEF};syncUI();draw()};
$('#focusT').onclick=()=>{S.focus=!S.focus;syncUI();draw()};
$('#bg').oninput=e=>{S.bg=+e.target.value;$('#bgv').textContent=S.bg;draw(true);clearTimeout(hiTimer);hiTimer=setTimeout(()=>draw(false),120)};

/* ---------- file / export ---------- */
let fileTarget=null;
$('#btnPick').onclick=$('#btnNew').onclick=()=>{fileTarget=null;$('#file').click()};
$('#btnSample').onclick=sample;
$('#file').onchange=e=>{const fs=[...e.target.files];e.target.value='';addFiles(fs,fileTarget);fileTarget=null};
let dc=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dc++;$('#dropHi').classList.add('on')});
window.addEventListener('dragleave',e=>{dc--;if(dc<=0){dc=0;$('#dropHi').classList.remove('on')}});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dc=0;$('#dropHi').classList.remove('on');addFiles(e.dataTransfer.files,null)});
function doExport(){
  const pr=$('#prog');$('#progTxt').textContent='Rendering…';pr.classList.add('on');$('#btnExport').disabled=true;
  setTimeout(()=>{
    const src=Math.max(...S.layers.map(l=>l.img?Math.max(l.img.width,l.img.height):0));
    const long=Math.min(4000,Math.max(1600,src)),im=render(long,S.exportBg==='clear');
    const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').putImageData(im,0,0);
    c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`riso-${Date.now()}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      pr.classList.remove('on');$('#btnExport').disabled=false},'image/png');
  },30);
}
const dlMenu=$('#dlMenu');
function setMenu(o){dlMenu.hidden=!o;$('#btnExport').setAttribute('aria-expanded',o)}
$('#btnExport').onclick=e=>{e.stopPropagation();setMenu(dlMenu.hidden)};
dlMenu.onclick=e=>{const b=e.target.closest('button');if(!b)return;S.exportBg=b.dataset.b;setMenu(false);doExport()};
document.addEventListener('click',()=>setMenu(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
buildStatic();syncUI();
</script>
</body>
</html>
